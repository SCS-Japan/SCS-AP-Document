<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCS 評価制度 資料台帳</title>
<meta name="description" content="SCS評価制度の公開資料を、要求事項・評価基準、制度規程・規則・基準、委員会・議事の3分類で整理した資料台帳。各資料の版履歴・差分・原本を参照できます。">
<style>
/* Hallmark · v2.0.0 · theme: Material (by request) · genre: modern-minimal · shape: docs shell with a register table and document pages · hero: index · nav: left rail, three sections · footer: pager and colophon · posture: restrained · surface: absolute · critique: the record is the page: code, title, dates, versions */
/* Hallmark · waive 67: SCS-400 / SCS-410AP are official document codes, set in the body face as identifiers, not capitals as a style */
/* =========================================================
   tokens: five text colours only (black, white, red, blue, green)
   ========================================================= */
:root{
  --black:#000000;
  --white:#ffffff;
  --blue:#1565c0;
  --blue-deep:#0d47a1;
  --blue-tint:#e8f0fb;
  --red:#c62828;
  --green:#2e7d32;
  --green-tint:#e8f0eb;
  --rule:#d5d9d9;
  --rule-soft:#e6e8e8;
  --wash:#f5f6f6;
  --surface:#ffffff;
  --header-fg:rgba(255,255,255,.16);
  --header-line:rgba(255,255,255,.55);
  --shadow:0 1px 3px rgba(0,0,0,.3);
  --scrim:rgba(0,0,0,.4);
  --header-h:56px;
  --sidebar:14.5rem;
  --toc:13rem;
  --font:"Roboto","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Courier New",monospace;
  --ease:cubic-bezier(.2,.6,.35,1);
}
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:clip;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{overflow-x:clip;margin:0;background:var(--surface);color:var(--black);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
::selection{background:var(--blue);color:var(--white)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
[hidden]{display:none!important}

/* header */
.md-header{position:sticky;top:0;z-index:60;background:var(--blue);color:var(--white);box-shadow:var(--shadow)}
.md-header__inner{max-width:90rem;margin:0 auto;padding:0 1.25rem 0 .75rem;min-height:var(--header-h);display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.md-header__menu{display:none;width:2.75rem;height:2.75rem;padding:0;border:0;background:transparent;color:var(--white);cursor:pointer;align-items:center;justify-content:center}
.md-header__menu svg{width:1.375rem;height:1.375rem}
.md-header__brand{display:flex;align-items:center;gap:.625rem;color:var(--white);text-decoration:none;min-height:2.75rem;padding:.5rem 0}
.md-header__brand svg{width:1.5rem;height:1.5rem;flex:0 0 auto}
.md-header__title{font-size:1.125rem;font-weight:500;white-space:nowrap}
.md-header__spacer{flex:1 1 auto}
.md-search{position:relative;flex:0 1 17rem;min-width:11rem}
.md-search__input{width:100%;height:2.375rem;padding:0 .75rem 0 2.375rem;border:1px solid var(--header-line);border-radius:.25rem;background:var(--header-fg);color:var(--white);font:inherit;font-size:.9375rem}
.md-search__input::placeholder{color:var(--white);opacity:.92}
.md-search__icon{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);width:1rem;height:1rem;color:var(--white);pointer-events:none}

/* layout */
.md-layout{max-width:90rem;margin:0 auto;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr) var(--toc);align-items:start}
.md-nav{position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));overflow-y:auto;border-right:1px solid var(--rule-soft);padding:1.25rem 0 2.5rem;background:var(--surface)}
.md-nav__list{list-style:none;margin:0;padding:0}
.md-nav__link{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;padding:.6875rem 1.25rem;border-left:3px solid transparent;color:var(--black);text-decoration:none;font-size:.9375rem;line-height:1.5}
.md-nav__link:hover{background:var(--wash)}
.md-nav__link[aria-current="page"]{color:var(--blue);border-left-color:var(--blue);background:var(--blue-tint);font-weight:500}
.md-nav__count{font-family:var(--mono);font-size:.8125rem;color:var(--green);font-variant-numeric:tabular-nums}
.md-nav__note{margin:1.5rem 1.25rem 0;padding-top:1rem;border-top:1px solid var(--rule-soft);font-size:.75rem;line-height:1.7;color:var(--black)}
.md-main{min-width:0;padding:1.75rem 2.5rem 3.5rem}
.md-content{max-width:60rem}
.md-breadcrumb{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;font-size:.8125rem;margin:0 0 1.25rem;color:var(--black)}
.md-breadcrumb a{color:var(--blue);text-decoration:none}
.md-breadcrumb a:hover{text-decoration:underline}
.md-breadcrumb__sep{color:var(--black)}
h1{margin:0;font-size:1.875rem;line-height:1.35;font-weight:700;text-wrap:balance;overflow-wrap:break-word;min-width:0}
.md-sub{margin:.5rem 0 0;font-size:1rem;line-height:1.6;font-weight:400;color:var(--black);overflow-wrap:break-word}
.md-lead{margin:.625rem 0 0;font-size:.9375rem;color:var(--black)}
.md-flag{display:inline-block;margin:0 0 1rem;padding:.125rem .5rem;border:1px solid var(--red);border-radius:.1875rem;color:var(--red);font-size:.8125rem;line-height:1.6}
.md-tag{display:inline-block;margin:.75rem 0 0;padding:.125rem .5rem;border:1px solid var(--green);border-radius:.1875rem;color:var(--green);font-size:.8125rem}

/* tabs */
.md-tabs{margin-top:1.5rem;border-bottom:1px solid var(--rule);display:flex;gap:1.875rem;overflow-x:auto}
.md-tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:.6875rem .125rem .75rem;font:inherit;font-size:.9375rem;font-weight:500;color:var(--black);white-space:nowrap;cursor:pointer;display:inline-flex;align-items:baseline;gap:.4375rem;text-decoration:none}
.md-tab:hover{color:var(--blue)}
.md-tab[aria-current="page"]{color:var(--blue);border-bottom-color:var(--blue)}
.md-tab__count{font-family:var(--mono);font-size:.8125rem;font-weight:400;color:var(--green)}

/* tables */
.md-panel{padding-top:1.25rem}
.md-table-wrap{overflow-x:auto}
table.md-table{width:100%;border-collapse:collapse;font-size:1rem;line-height:1.6}
.md-table th{text-align:left;font-size:.875rem;font-weight:700;padding:.625rem .75rem;border-bottom:2px solid var(--rule);white-space:nowrap;background:var(--wash)}
.md-table td{padding:.8125rem .75rem;border-bottom:1px solid var(--rule-soft);vertical-align:top}
.md-table .no{font-family:var(--mono);font-size:.9375rem;white-space:nowrap;width:8.5rem;font-variant-numeric:tabular-nums}
.md-table .name{overflow-wrap:break-word}
.md-table .date{font-family:var(--mono);font-size:.9375rem;white-space:nowrap;width:8.5rem;font-variant-numeric:tabular-nums}
.md-table .size{font-family:var(--mono);font-size:.9375rem;white-space:nowrap;width:6.5rem;text-align:right;font-variant-numeric:tabular-nums}
.md-table .ver{white-space:nowrap;width:5.5rem}
.md-table .ver a{text-decoration:none;font-weight:500}
.md-table .ver span{color:var(--black)}
.md-table .acts{white-space:nowrap;width:4.5rem;text-align:right}
.md-table tbody tr:hover{background:var(--wash)}
.md-table caption{text-align:left;font-size:.8125rem;color:var(--black);padding:0 0 .625rem}

/* list rows */
.md-rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.md-row{position:relative;display:flex;align-items:baseline;gap:1rem;padding:.875rem .5rem;border-bottom:1px solid var(--rule-soft)}
.md-row:hover{background:var(--wash)}
.md-row__no{font-family:var(--mono);font-size:.9375rem;width:8.5rem;flex:0 0 auto;color:var(--black);font-variant-numeric:tabular-nums}
.md-row__title{flex:1 1 auto;min-width:0;color:var(--black);font-size:1rem;overflow-wrap:break-word}
.md-row__go{flex:0 0 auto;color:var(--blue);font-size:1rem}
.md-row > a{display:flex;align-items:baseline;gap:1rem;flex:1 1 auto;min-width:0;text-decoration:none;color:inherit}
.md-row > a::after{content:"";position:absolute;inset:0}
.md-row > a:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.md-row:hover .md-row__go{color:var(--blue-deep)}
.md-empty{margin:1.75rem 0 0;font-size:.9375rem;color:var(--red)}
.md-hint{margin:2rem 0 0;font-size:.8125rem;color:var(--black)}
.md-results__head{display:flex;align-items:baseline;gap:.75rem;margin:0 0 .75rem}
.md-results__title{margin:0;font-size:1.125rem;font-weight:700}
.md-results__count{font-size:.8125rem;color:var(--black)}
.md-results__count b{font-family:var(--mono);color:var(--green)}

/* definition table */
table.md-info{width:100%;border-collapse:collapse;font-size:1rem;margin:.5rem 0 0}
.md-info th{width:9.5rem;text-align:left;vertical-align:top;font-weight:700;font-size:.875rem;padding:.75rem .75rem .75rem 0;border-bottom:1px solid var(--rule-soft);white-space:nowrap}
.md-info td{padding:.75rem 0;border-bottom:1px solid var(--rule-soft);vertical-align:top;overflow-wrap:break-word}
.md-info tr:first-child th,.md-info tr:first-child td{border-top:1px solid var(--rule-soft)}
.md-info .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.md-info .vnum{color:var(--green);font-weight:700}
.md-links{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem}
.md-links a{font-size:.9375rem}

/* heading + sections */
h2{margin:2.25rem 0 .5rem;font-size:1.25rem;font-weight:700;line-height:1.4;text-wrap:balance;scroll-margin-top:4.5rem}
h2 .h2count{font-size:.875rem;font-weight:400;color:var(--green);font-family:var(--mono);margin-left:.375rem}
.md-note{margin:.75rem 0 0;font-size:.8125rem;color:var(--black)}
.md-actions{display:flex;flex-wrap:wrap;gap:.75rem;margin:1rem 0 0}
.md-btn{display:inline-flex;align-items:center;gap:.375rem;min-height:2.75rem;padding:.5rem .875rem;border:1px solid var(--blue);border-radius:.25rem;color:var(--blue);background:var(--surface);text-decoration:none;font-size:.9375rem}
.md-btn:hover{background:var(--blue-tint)}
.md-btn--solid{background:var(--blue);color:var(--white)}
.md-btn--solid:hover{background:var(--blue-deep);border-color:var(--blue-deep)}
.md-btn[aria-disabled="true"]{border-color:var(--rule);color:var(--black);opacity:.5;pointer-events:none}

/* toc */
.md-toc{position:sticky;top:var(--header-h);max-height:calc(100vh - var(--header-h));overflow-y:auto;padding:2rem 1.25rem 2.5rem}
.md-toc__title{margin:0 0 .75rem;font-size:.8125rem;font-weight:700}
.md-toc__list{list-style:none;margin:0;padding:0;border-left:1px solid var(--rule)}
.md-toc__link{display:block;padding:.4375rem .625rem .4375rem .75rem;margin-left:-1px;border-left:2px solid transparent;color:var(--black);text-decoration:none;font-size:.8125rem;line-height:1.5}
.md-toc__link:hover{color:var(--blue)}
.md-toc__link[aria-current="true"]{color:var(--blue);border-left-color:var(--blue);font-weight:500}
.md-toc__total{margin:1.125rem 0 0;font-size:.75rem;color:var(--black)}
.md-toc__note{margin:1rem 0 0;font-size:.75rem;line-height:1.7;color:var(--black)}

/* footer */
.md-footer{border-top:1px solid var(--rule);background:var(--surface)}
.md-footer__inner{max-width:90rem;margin:0 auto;padding:1.25rem 2.5rem 1.75rem}
.md-pager{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem}
.md-pager__btn{display:flex;flex-direction:column;gap:.125rem;padding:.75rem 1rem;min-height:4rem;border:1px solid var(--rule);border-radius:.25rem;background:var(--surface);color:var(--black);text-align:left;text-decoration:none;justify-content:center}
.md-pager__btn:hover{background:var(--wash);border-color:var(--blue)}
.md-pager__dir{font-size:.75rem;color:var(--black)}
.md-pager__label{color:var(--blue);font-size:.9375rem;font-weight:500;overflow-wrap:break-word}
.md-pager__next{text-align:right;align-items:flex-end}
.md-footer__meta{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;justify-content:space-between;border-top:1px solid var(--rule-soft);padding-top:1rem;font-size:.75rem;color:var(--black)}
.md-footer__meta a{color:var(--blue)}

/* drawer */
.md-backdrop{display:none;position:fixed;inset:var(--header-h) 0 0;background:var(--scrim);z-index:50;border:0;padding:0}
.md-backdrop.is-open{display:block}

/* responsive */
@media (max-width:75rem){
  .md-layout{grid-template-columns:var(--sidebar) minmax(0,1fr)}
  .md-toc{display:none}
  .md-main{padding-right:2rem}
}
@media (max-width:56rem){
  .md-layout{grid-template-columns:minmax(0,1fr)}
  .md-header__menu{display:inline-flex}
  .md-nav{position:fixed;left:0;top:var(--header-h);z-index:70;width:18rem;transform:translateX(-100%);transition:transform .18s var(--ease);box-shadow:var(--shadow)}
  .md-nav.is-open{transform:translateX(0)}
  .md-main{padding:1.375rem 1.25rem 3rem}
}
@media (max-width:44rem){
  .md-header__inner{gap:.5rem;padding-bottom:.625rem}
  .md-search{flex:1 1 100%;min-width:0;order:3}
  .md-header__spacer{display:none}
  h1{font-size:1.5rem}
  .md-tabs{display:block;border-bottom:0;border-top:1px solid var(--rule);margin-top:1.375rem}
  .md-tab{display:flex;width:100%;justify-content:space-between;border-bottom:1px solid var(--rule);border-left:3px solid transparent;margin-bottom:0;padding:.8125rem .375rem .8125rem .625rem}
  .md-tab[aria-current="page"]{border-bottom-color:var(--rule);border-left-color:var(--blue)}
  .md-row{flex-wrap:wrap;gap:.25rem}
  .md-row__no{width:auto}
  .md-row__title{flex:1 1 100%}
  .md-table .no,.md-table .date{width:auto}
  .md-info th{width:7.5rem}
  .md-pager{grid-template-columns:1fr}
  .md-pager__btn[hidden]{display:none}
  .md-footer__inner{padding:1.25rem 1.25rem 1.5rem}
}

.md-table .loc{white-space:nowrap;width:9.5rem;font-size:.9375rem}
.md-table .chg{font-family:var(--mono);white-space:nowrap;width:7rem;font-variant-numeric:tabular-nums;text-align:right}
.md-table .saved{white-space:nowrap;width:8.5rem}
.md-table .saved .sep{color:var(--black)}
.md-table .acts a{text-decoration:none}
.md-caption{display:block;margin-top:.25rem;font-size:.8125rem;line-height:1.6;color:var(--black)}
.md-body{margin:.75rem 0 0;font-size:1rem;line-height:1.75}
@media (max-width:44rem){
  .md-table .loc,.md-table .chg,.md-table .saved{width:auto}
}
@media print{.md-header,.md-nav,.md-toc,.md-footer{display:none}.md-layout{display:block}.md-main{padding:0}}

</style>
</head>

<script>
(function () {
  "use strict";
  var D = window.SCS;
  var CATS = D.cats, DOCS = D.docs;
  var lastKey = "";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function catOf(key) {
    for (var i = 0; i < CATS.length; i++) if (CATS[i].key === key) return CATS[i];
    return CATS[0];
  }
  function docList(key) { return catOf(key).docs; }
  function totalDocs() { var n = 0; CATS.forEach(function (c) { n += c.docs.length; }); return n; }
  function totalVers() {
    var n = 0;
    Object.keys(DOCS).forEach(function (k) { n += DOCS[k].versions.length; });
    return n;
  }

  /* ---------- routes ---------- */
  function parse() {
    var h = (location.hash || "").replace(/^#\/?/, "");
    var parts = h.split("/").filter(Boolean).map(decodeURIComponent);
    if (!parts.length) return { view: "list", cat: "criteria" };
    if (parts[0] === "cat") return { view: "list", cat: parts[1] };
    if (parts[0] === "q") return { view: "search", q: parts.slice(1).join("/") };
    if (parts[0] === "about") return { view: "about" };
    if (parts[0] === "doc" && DOCS[parts[1]]) {
      if (parts[2]) return { view: "version", id: parts[1], slug: parts[2] };
      return { view: "doc", id: parts[1] };
    }
    return { view: "list", cat: "criteria" };
  }
  function go(h) { if (location.hash !== h) location.hash = h; else render(); }

  /* ---------- chrome ---------- */
  function renderNav(route) {
    var html = '<ul class="md-nav__list">';
    html += '<li><a class="md-nav__link" href="#/"' + (route.view === "list" ? ' aria-current="page"' : "") + ">ホーム</a></li>";
    CATS.forEach(function (c) {
      var active = (route.view === "list" && route.cat === c.key) ||
        ((route.view === "doc" || route.view === "version") && DOCS[route.id] && DOCS[route.id].cat === c.key);
      html += '<li><a class="md-nav__link" href="#/cat/' + c.key + '"' + (active ? ' aria-current="page"' : "") +
        ">" + esc(c.label) + '<span class="md-nav__count">' + c.docs.length + "</span></a></li>";
    });
    html += '<li><a class="md-nav__link" href="#/about"' + (route.view === "about" ? ' aria-current="page"' : "") + ">このサイトについて</a></li>";
    html += "</ul>";
    html += '<p class="md-nav__note">出典は documents.md、原本は IPA の公開ページです。</p>';
    document.getElementById("nav").innerHTML = html;
  }

  function renderToc(route) {
    var el = document.getElementById("toc"), items = [], foot = "";
    if (route.view === "list") {
      CATS.forEach(function (c) { items.push({ href: "#/cat/" + c.key, label: c.label, cur: route.cat === c.key }); });
      foot = '<p class="md-toc__total">全 ' + totalDocs() + " 件</p>";
    } else if (route.view === "doc") {
      items.push({ href: "#info", label: "基本情報", cur: true });
      items.push({ href: "#versions", label: "版の履歴（" + DOCS[route.id].versions.length + " 版）", cur: false });
      foot = "";
    } else if (route.view === "version") {
      items.push({ href: "#info", label: "この版の情報", cur: true });
      items.push({ href: "#/doc/" + route.id, label: "現在の版（最新）", cur: false });
      foot = '<p class="md-toc__note">過去の版は更新されません。</p>';
    } else if (route.view === "about") {
      items.push({ href: "#what", label: "このサイト", cur: true });
      items.push({ href: "#ref", label: "出典", cur: false });
      items.push({ href: "#license", label: "取り扱い", cur: false });
      foot = "";
    } else {
      items.push({ href: "#results", label: "検索結果", cur: true });
      foot = "";
    }
    var html = '<p class="md-toc__title">目次</p><ul class="md-toc__list">';
    items.forEach(function (i) {
      html += '<li><a class="md-toc__link" href="' + i.href + '"' + (i.cur ? ' aria-current="true"' : "") + ">" + esc(i.label) + "</a></li>";
    });
    html += "</ul>" + foot;
    el.innerHTML = html;
  }

  function renderFooter(route) {
    var html = "";
    if (route.view === "list") {
      var idx = 0;
      CATS.forEach(function (c, i) { if (c.key === route.cat) idx = i; });
      var prev = CATS[idx - 1], next = CATS[idx + 1];
      html = '<div class="md-pager">' +
        (prev ? '<a class="md-pager__btn" href="#/cat/' + prev.key + '"><span class="md-pager__dir">← 前へ</span><span class="md-pager__label">' + esc(prev.label) + "</span></a>" : "<span></span>") +
        (next ? '<a class="md-pager__btn md-pager__next" href="#/cat/' + next.key + '"><span class="md-pager__dir">次へ →</span><span class="md-pager__label">' + esc(next.label) + "</span></a>" : "<span></span>") +
        "</div>";
    } else if (route.view === "doc") {
      var d = DOCS[route.id], list = docList(d.cat), i = docList(d.cat).indexOf(route.id);
      var p = docList(d.cat)[i - 1], n = docList(d.cat)[i + 1];
      html = '<div class="md-pager">' +
        (p ? '<a class="md-pager__btn" href="#/doc/' + p + '"><span class="md-pager__dir">← 前へ</span><span class="md-pager__label">' + esc(DOCS[p].no || DOCS[p].title) + "</span></a>" : "<span></span>") +
        (n ? '<a class="md-pager__btn md-pager__next" href="#/doc/' + n + '"><span class="md-pager__dir">次へ →</span><span class="md-pager__label">' + esc(DOCS[n].no || DOCS[n].title) + "</span></a>" : "<span></span>") +
        "</div>";
    } else if (route.view === "version") {
      html = '<div class="md-pager"><span></span><a class="md-pager__btn md-pager__next" href="#/doc/' + route.id + '"><span class="md-pager__dir">次へ →</span><span class="md-pager__label">現在の版（最新）</span></a></div>';
    }
    html += '<div class="md-footer__meta">' +
      "<span>出典: <a href=\"" + esc(D.source) + '" target="_blank" rel="noopener">history/documents.md</a>' +
      "（<a href=\"" + esc(D.repo) + '" target="_blank" rel="noopener">SCS-Japan/SCS-AP-Document</a>）</span>' +
      "<span>原本: <a href=\"" + esc(D.origin) + '" target="_blank" rel="noopener">IPA SCS評価制度</a> ・ 非公式の一覧</span>' +
      "<span>生成日 " + esc(D.built) + "</span></div>";
    document.getElementById("foot").innerHTML = html;
  }

  /* ---------- pieces ---------- */
  function crumb(items) {
    var html = '<nav class="md-breadcrumb" aria-label="パンくず">';
    items.forEach(function (it, i) {
      if (i) html += '<span class="md-breadcrumb__sep" aria-hidden="true">/</span>';
      html += it.href ? '<a href="' + it.href + '">' + esc(it.label) + "</a>" : "<span>" + esc(it.label) + "</span>";
    });
    return html + "</nav>";
  }

  function versionRows(d) {
    return d.versions.map(function (v) {
      var saved = [];
      if (v.orig) saved.push('<a href="' + esc(v.orig) + '" target="_blank" rel="noopener">原本</a>');
      if (v.md) saved.push('<a href="' + esc(v.md) + '" target="_blank" rel="noopener">md</a>');
      return "<tr><td class=\"ver\">" +
        (v.latest ? '<span class="vnum">' + esc(v.label) + "</span>" : '<a href="#/doc/' + d.id + "/" + v.slug + '">' + esc(v.label) + "</a>") +
        '</td><td class="date">' + esc(v.date) + "</td>" +
        '<td class="loc">' + esc(v.loc) + "</td>" +
        '<td class="size">' + esc(v.size || "なし") + "</td>" +
        '<td class="chg">' + esc(v.changes || "なし") + "</td>" +
        '<td class="saved">' + (saved.length ? saved.join(' <span class="sep">/</span> ') : "なし") + "</td>" +
        '<td class="acts">' + (v.diff ? '<a href="' + esc(v.diff) + '" target="_blank" rel="noopener">diff</a>' : "なし") + "</td></tr>";
    }).join("");
  }

  function versionTable(d) {
    return '<h2 id="versions">版の履歴<span class="h2count">' + d.versions.length + " 版</span></h2>" +
      '<div class="md-table-wrap"><table class="md-table"><thead><tr>' +
      '<th scope="col">版</th><th scope="col">検知日</th><th scope="col">保存先</th><th scope="col">サイズ</th>' +
      '<th scope="col">変更行</th><th scope="col">保存</th><th scope="col">差分</th>' +
      "</tr></thead><tbody>" + versionRows(d) + "</tbody></table></div>" +
      '<p class="md-note">版は documents.md の「バージョン」列の値です。版を選ぶとその版のページが開きます。変更行と差分は「文書の過去の版」の値です。</p>';
  }

  /* ---------- views ---------- */
  function viewList(route) {
    var cat = catOf(route.cat);
    var rows = cat.docs.map(function (id) {
      var d = DOCS[id];
      return '<li class="md-row"><a href="#/doc/' + id + '">' +
        (d.no ? '<span class="md-row__no">' + esc(d.no) + "</span>" : "") +
        '<span class="md-row__title">' + esc(d.title) + "</span>" +
        '<span class="md-row__go" aria-hidden="true">›</span></a></li>';
    }).join("");
    var tabs = '<nav class="md-tabs" aria-label="分類">' + CATS.map(function (c) {
      return '<a class="md-tab" href="#/cat/' + c.key + '"' + (c.key === cat.key ? ' aria-current="page"' : "") + ">" +
        esc(c.label) + '<span class="md-tab__count">' + c.docs.length + "</span></a>";
    }).join("") + "</nav>";

    return crumb([{ label: "ホーム", href: "#/" }, { label: "資料台帳" }]) +
      "<h1>SCS 評価制度 資料台帳</h1>" +
      '<p class="md-lead">公開資料 ' + totalDocs() + " 件、版 " + totalVers() + " 件を収録しています。</p>" +
      tabs +
      '<section class="md-panel"><ul class="md-rows">' + rows + "</ul></section>" +
      '<p class="md-hint">各行から、版の履歴・diff・原本・出典を開けます。</p>';
  }

  function viewSearch(route) {
    var q = (route.q || "").toLowerCase(), hits = [];
    CATS.forEach(function (c) {
      c.docs.forEach(function (id) {
        var d = DOCS[id];
        if ((d.title + " " + (d.no || "") + " " + c.label).toLowerCase().indexOf(q) !== -1) hits.push({ d: d, cat: c });
      });
    });
    var body = hits.map(function (h) {
      return "<tr><td>" + esc(h.cat.label) + '</td><td class="no">' + esc(h.d.no || "") +
        '</td><td class="name"><a href="#/doc/' + h.d.id + '">' + esc(h.d.title) + "</a></td></tr>";
    }).join("");
    return crumb([{ label: "ホーム", href: "#/" }, { label: "検索" }]) +
      '<h1 id="results">検索結果</h1>' +
      '<p class="md-lead">「' + esc(route.q) + "」の該当 <b>" + hits.length + "</b> 件 / 全 " + totalDocs() + " 件</p>" +
      (hits.length
        ? '<div class="md-panel"><div class="md-table-wrap"><table class="md-table"><thead><tr><th scope="col">分類</th><th scope="col">管理番号</th><th scope="col">資料名</th></tr></thead><tbody>' + body + "</tbody></table></div></div>"
        : '<p class="md-empty">該当する資料はありません。</p>');
  }

  function fmtDot(s) { return s ? s.replace(/-/g, ".") : "なし"; }

  function viewDoc(route) {
    var d = DOCS[route.id], cat = catOf(d.cat);
    var links = [];
    if (d.ipa) links.push('<a href="' + esc(d.ipa) + '" target="_blank" rel="noopener">' + esc(d.fmt) + " を開く（IPA）↗</a>");
    if (d.pageUrl) links.push('<a href="' + esc(d.pageUrl) + '" target="_blank" rel="noopener">参照サイト ↗</a>');

    return crumb([{ label: "ホーム", href: "#/" }, { label: cat.label, href: "#/cat/" + cat.key }, { label: d.no || d.title }]) +
      "<h1>" + esc(d.no || d.title) + "</h1>" +
      (d.no ? '<p class="md-sub">' + esc(d.title) + "</p>" : "") +
      (d.tag ? '<p class="md-tag">' + esc(d.tag) + "</p>" : "") +
      '<h2 id="info">基本情報</h2>' +
      '<table class="md-info"><tbody>' +
      '<tr><th scope="row">更新日</th><td class="mono">' + fmtDot(d.last) + "</td></tr>" +
      '<tr><th scope="row">最新バージョン</th><td class="vnum">' + esc(d.verCol || d.versions[0].date) + "</td></tr>" +
      '<tr><th scope="row">リンク</th><td><div class="md-links">' + links.join("") + "</div></td></tr>" +
      '<tr><th scope="row">公式更新日</th><td>' + esc(d.official || "記載なし") + "</td></tr>" +
      '<tr><th scope="row">初回取得</th><td class="mono">' + esc(d.first) + "</td></tr>" +
      '<tr><th scope="row">最終取得日</th><td class="mono">' + esc(d.last) + "</td></tr>" +
      "</tbody></table>" +
      versionTable(d);
  }

  function viewVersion(route) {
    var d = DOCS[route.id], cat = catOf(d.cat), v = null;
    d.versions.forEach(function (x) { if (x.slug === route.slug) v = x; });
    if (!v) return viewDoc(route);
    var links = [];
    if (v.orig) links.push('<a class="md-btn md-btn--solid" href="' + esc(v.orig) + '" target="_blank" rel="noopener">原本を開く（GitHub）↗</a>');
    if (v.md) links.push('<a class="md-btn" href="' + esc(v.md) + '" target="_blank" rel="noopener">md を開く ↗</a>');
    if (v.diff) links.push('<a class="md-btn" href="' + esc(v.diff) + '" target="_blank" rel="noopener">差分 ↗</a>');

    return crumb([{ label: "ホーム", href: "#/" }, { label: cat.label, href: "#/cat/" + cat.key },
      { label: d.no || d.title, href: "#/doc/" + d.id }, { label: v.label }]) +
      "<h1>" + esc(d.no || d.title) + " " + esc(v.label) + "</h1>" +
      (d.no ? '<p class="md-sub">' + esc(d.title) + "</p>" : "") +
      (v.latest ? "" : '<p class="md-flag">過去の版</p>') +
      '<h2 id="info">この版の情報</h2>' +
      '<table class="md-info"><tbody>' +
      '<tr><th scope="row">版</th><td>' + esc(v.label) + "</td></tr>" +
      '<tr><th scope="row">検知日</th><td class="mono">' + esc(v.date) + "</td></tr>" +
      '<tr><th scope="row">保存先</th><td>' + esc(v.loc) + "</td></tr>" +
      '<tr><th scope="row">サイズ</th><td class="mono">' + esc(v.size || "なし") + "</td></tr>" +
      '<tr><th scope="row">変更行</th><td class="mono">' + esc(v.changes || "なし") + "</td></tr>" +
      "</tbody></table>" +
      '<h2 id="links">この版を開く</h2><div class="md-actions">' + links.join("") + "</div>" +
      '<p class="md-note"><a href="#/doc/' + d.id + '">この資料の現在の版を見る</a></p>';
  }

  function viewAbout() {
    return crumb([{ label: "ホーム", href: "#/" }, { label: "このサイトについて" }]) +
      '<h1 id="what">このサイトについて</h1>' +
      '<p class="md-lead">SCS 評価制度の公開資料を、台帳データから自動生成した一覧です。原本は掲載せず、所在と版だけを示します。</p>' +
      '<table class="md-info"><tbody>' +
      '<tr><th scope="row">収録</th><td>資料 ' + totalDocs() + " 件、版 " + totalVers() + " 件（3 分類）</td></tr>" +
      '<tr><th scope="row">生成</th><td class="mono">' + esc(D.built) + "</td></tr>" +
      '<tr><th scope="row">生成方法</th><td>SCS-AP-Document の <span class="mono">history/documents.md</span> を解析して HTML を生成。文書表・「文書の過去の版」をそのまま反映します。</td></tr>' +
      "</tbody></table>" +
      '<h2 id="ref">出典</h2>' +
      '<table class="md-info"><tbody>' +
      '<tr><th scope="row">台帳データ</th><td><div class="md-links"><a href="' + esc(D.source) + '" target="_blank" rel="noopener">history/documents.md ↗</a></div><span class="md-caption">文書名、管理番号、形式、サイズ、公式更新日、取得日、版、差分。すべてこのファイルの値です。</span></td></tr>' +
      '<tr><th scope="row">原本</th><td><div class="md-links"><a href="' + esc(D.origin) + '" target="_blank" rel="noopener">IPA SCS評価制度 ↗</a></div><span class="md-caption">各資料のリンク先は IPA の公開ページです。</span></td></tr>' +
      '<tr><th scope="row">アーカイブ</th><td><div class="md-links"><a href="' + esc(D.repo) + '" target="_blank" rel="noopener">SCS-Japan/SCS-AP-Document ↗</a></div><span class="md-caption">原本と md、差分の保存先です。</span></td></tr>' +
      "</tbody></table>" +
      '<h2 id="license">取り扱い</h2>' +
      '<p class="md-body">本サイトは非公式の一覧です。資料の著作権は経済産業省および IPA に帰属します。内容の正確な判断は原本で確認してください。版の検知日・差分はアーカイブの取得結果であり、公式の更新日とは異なる場合があります。</p>';
  }

  /* ---------- render ---------- */
  function render() {
    var route = parse(), html;
    if (route.view === "doc") html = viewDoc(route);
    else if (route.view === "version") html = viewVersion(route);
    else if (route.view === "search") html = viewSearch(route);
    else if (route.view === "about") html = viewAbout();
    else html = viewList(route);

    document.getElementById("view").innerHTML = html;
    renderNav(route);
    renderToc(route);
    renderFooter(route);

    var qEl = document.getElementById("q");
    if (route.view === "search") { if (document.activeElement !== qEl) qEl.value = route.q; }
    else if (document.activeElement !== qEl) qEl.value = "";

    document.title = (route.view === "list" ? D.site :
      route.view === "search" ? "検索: " + route.q :
        route.view === "doc" ? (DOCS[route.id].no || DOCS[route.id].title) + " | " + D.site :
          route.view === "version" ? (DOCS[route.id].no || DOCS[route.id].title) + " " + route.slug + " | " + D.site :
            "このサイトについて | " + D.site);

    closeDrawer();
    if (location.hash !== lastKey) {
      lastKey = location.hash;
      window.scrollTo({ top: 0, behavior: "auto" });
    }
  }

  /* ---------- search ---------- */
  var qEl = document.getElementById("q"), t;
  qEl.addEventListener("input", function () {
    clearTimeout(t);
    var v = qEl.value.trim();
    t = setTimeout(function () {
      if (!v) { go("#/cat/" + (parse().cat || "criteria")); return; }
      var h = "#/q/" + encodeURIComponent(v);
      if (location.hash !== h) location.hash = h; else render();
    }, 140);
  });
  qEl.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { qEl.value = ""; go("#/"); qEl.blur(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
      e.preventDefault(); qEl.focus();
    }
  });

  /* ---------- drawer ---------- */
  var nav = document.getElementById("nav"), btn = document.getElementById("menu"), back = document.getElementById("backdrop");
  function closeDrawer() {
    nav.classList.remove("is-open"); back.classList.remove("is-open");
    btn.setAttribute("aria-expanded", "false");
  }
  btn.addEventListener("click", function () {
    var open = !nav.classList.contains("is-open");
    nav.classList.toggle("is-open", open); back.classList.toggle("is-open", open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  });
  back.addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });

  window.addEventListener("hashchange", render);
  render();
})();

</script>
</body>
</html>
